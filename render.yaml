services:
  - type: web
    name: threadform
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix server ci && npm run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
